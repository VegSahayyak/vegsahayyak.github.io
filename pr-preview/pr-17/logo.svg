<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="120" height="120" rx="28" fill="#0A0F1D" />
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Speedometer Arc Track -->
  <circle cx="60" cy="64" r="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="7" stroke-dasharray="198 264" stroke-dashoffset="-33" stroke-linecap="round" />
  
  <!-- Active Arc -->
  <circle cx="60" cy="64" r="42" fill="none" stroke="url(#glowGrad)" stroke-width="7" stroke-dasharray="140 264" stroke-dashoffset="-33" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Hub -->
  <circle cx="60" cy="64" r="10" fill="#151E33" stroke="url(#glowGrad)" stroke-width="2.5" />
  <circle cx="60" cy="64" r="4" fill="#00F2FE" />

  <!-- Needle -->
  <path d="M57.5 64 L59.5 28 C59.8 26.5 60.2 26.5 60.5 28 L62.5 64 Z" fill="url(#needleGrad)" transform="rotate(32 60 64)" filter="url(#glow)" />

  <!-- Pulse dots -->
  <circle cx="28" cy="88" r="2.5" fill="#38EF7D" opacity="0.8" />
  <circle cx="92" cy="88" r="2.5" fill="#FF4B2B" opacity="0.8" />
</svg>
